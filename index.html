<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <header>
      <!-- navbar section starts here -->

      <nav>
        <section id="navbar">
          <div class="navbar-items">
            <div class="logo">
              <img src="./assets/logo-navbar.png" alt="image" />
            </div>

            <div class="nav-links">
              <ul class="nav-menu">
                <li><a href="">Features</a></li>
                <li><a href="">How It Works</a></li>
                <li><a href="">Why It's Different</a></li>
              </ul>
            </div>

            <div class="nav-btn">
              <button class="btn-1"><a href="#"></a>Get Early Access</button>
            </div>
          </div>
        </section>
      </nav>

      <!-- navbar section ends here -->

      <section id="banner-section">
        <div class="banner-content">
          <div>
            <button class="early-access-btn">
              <img src="./assets/CheckCircle.png" alt="" />
              <span>Early Access Now Open</span>
            </button>
          </div>

          <div class="banner-text">
            <h1 class="banner-heading-1">Structured thinking,</h1>

            <h1 class="banner-heading-2">Not just note-taking.</h1>

            <p class="banner-info-1">
              A private space to store notes, links, and learning summaries —
              designed to
            </p>

            <p class="banner-info-2">
              help you think clearly, connect ideas, and turn learning into
              long-term knowledge.
            </p>
          </div>

          <div class="banner-btn">
            <button class="banner-btn-1">
              <span>Start Building Your Vault</span>
              <img src="./assets/ArrowRight.png" alt="" />
            </button>

            <button class="banner-btn-2">
              <i class="fa-solid fa-play" style="color: #ffffff"></i> See How It
              Works
            </button>
          </div>
        </div>
      </section>
    </header>

    <main></main>
  </body>
</html>
